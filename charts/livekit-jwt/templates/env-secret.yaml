apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "basename" . }}-env
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "labels" . | nindent 4 }}
stringData:
{{- range $key, $value := .Values.livekitJwt.config.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}